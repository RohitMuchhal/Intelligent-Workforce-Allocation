
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-gray-800">Register</h2>
        <form id="registerForm" class="mt-4">
            <label class="block text-sm font-medium text-gray-700">Name</label>
            <input type="text" id="name" class="w-full p-2 border rounded mt-1" required>

            <label class="block mt-3 text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" 
                   pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\\.com$"
                   title="Email must be a valid .com address"
                   class="w-full p-2 border rounded mt-1" 
                   required>

            <label class="block mt-3 text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" 
                   pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                   title="Must contain at least 1 uppercase letter, 1 number, 1 special symbol (@$!%*?&), and be 8+ characters"
                   class="w-full p-2 border rounded mt-1" 
                   required>

            <input type="hidden" id="role" value="EMPLOYEE">

            <button type="submit" class="mt-4 w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
                Register
            </button>
        </form>

        <p class="mt-3 text-sm text-center">
            Already have an account? <a href="login.html" class="text-blue-600">Login here</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const form = event.target;

            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: "EMPLOYEE"
            };

            fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            })
            .then(response => {
                if (response.ok) {
                    return response.text().then(data => {
                        alert(data);
                        form.reset();
                    });
                }
                return response.text().then(err => { throw new Error(err) });
            })
            .catch(error => {
                alert(error.message || 'Registration failed. Please try again.');
            });
        });
    </script>
</body>
</html>
